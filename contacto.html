<html>

<head>
    <title>Mi Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <nav class="navegacion">
            <a href="inicio.html">Inicio</a>
            <a href="proyectos.html">Proyectos</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main class="contacto-container">
        <h2>Contacto</h2>
        <section class="formulario-card">
            <form action="#">
                <div class="input-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre aquí...">
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                </div>

                <div class="input-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje..."></textarea>
                </div>

                <div class="botones-form">
                    <button type="submit" class="btn-enviar">Enviar</button>
                    <button type="reset" class="btn-limpiar">Limpiar formulario</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Alejandro Andrade Morales</p>
    </footer>
</body>

</html>
